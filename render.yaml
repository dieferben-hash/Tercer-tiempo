services:
  - type: web
    name: tercer-tiempo
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: tercer-tiempo-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
