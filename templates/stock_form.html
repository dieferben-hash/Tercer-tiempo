{% extends "base.html" %}
{% block title %}{{ "Editar producto" if producto else "Nuevo producto" }} · Tercer Tiempo{% endblock %}
{% block content %}
<h1 class="titulo-pagina">{{ "Editar producto" if producto else "Nuevo producto" }}</h1>

<form method="post" class="formulario formulario-tarjeta">
  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" value="{{ producto.nombre if producto else '' }}" required>

  <label for="categoria">Categoría</label>
  <select id="categoria" name="categoria">
    {% for cat in categorias %}
    <option value="{{ cat }}" {{ "selected" if producto and producto.categoria == cat else "" }}>
      {{ {"bebida_sin_alcohol": "Bebida sin alcohol", "bebida_alcoholica": "Bebida alcohólica", "comida_rapida": "Comida rápida", "otro": "Otro"}[cat] }}
    </option>
    {% endfor %}
  </select>

  <div class="formulario-fila">
    <div>
      <label for="precio_venta">Precio de venta (₲)</label>
      <input type="text" inputmode="numeric" id="precio_venta" name="precio_venta" value="{{ producto.precio_venta if producto else '' }}" required>
    </div>
    <div>
      <label for="precio_costo">Precio de costo (₲, opcional)</label>
      <input type="text" inputmode="numeric" id="precio_costo" name="precio_costo" value="{{ producto.precio_costo if producto else '' }}">
    </div>
  </div>

  {% if not producto %}
  <label for="stock">Stock inicial</label>
  <input type="number" id="stock" name="stock" value="0" min="0">
  {% endif %}

  <label for="stock_minimo">Stock mínimo (para alertas)</label>
  <input type="number" id="stock_minimo" name="stock_minimo" value="{{ producto.stock_minimo if producto else 5 }}" min="0">

  <button type="submit" class="btn btn-primario btn-grande">Guardar</button>
</form>
{% endblock %}
