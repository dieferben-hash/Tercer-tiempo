{% extends "base.html" %}
{% block title %}{{ "Editar usuario" if usuario else "Nuevo usuario" }} · Tercer Tiempo{% endblock %}
{% block content %}
<h1 class="titulo-pagina">{{ "Editar usuario" if usuario else "Nuevo usuario" }}</h1>

<form method="post" class="formulario formulario-tarjeta">
  <label for="nombre">Nombre completo</label>
  <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre if usuario else '' }}" required>

  {% if not usuario %}
  <label for="usuario">Usuario (para iniciar sesión)</label>
  <input type="text" id="usuario" name="usuario" required>
  {% endif %}

  <label for="password">{{ "Nueva contraseña (dejar en blanco para no cambiar)" if usuario else "Contraseña" }}</label>
  <input type="password" id="password" name="password" {{ "required" if not usuario else "" }}>

  <label for="rol">Rol</label>
  <select id="rol" name="rol">
    {% for r in roles %}
    <option value="{{ r }}" {{ "selected" if usuario and usuario.rol == r else "" }}>
      {{ "Administrador" if r == "administrador" else "Cajero" }}
    </option>
    {% endfor %}
  </select>

  {% if usuario %}
  <label class="check-linea">
    <input type="checkbox" name="activo" {{ "checked" if usuario.activo else "" }}>
    Usuario activo
  </label>
  {% endif %}

  <button type="submit" class="btn btn-primario btn-grande">Guardar</button>
</form>
{% endblock %}
